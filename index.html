<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZDOS // SUPREME ENTERPRISE</title>
    <meta name="zdos-kira-api-base" content="">
    <link rel="stylesheet" href="kira-widget.css">
    <script defer src="kira-widget.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'JetBrains Mono', monospace; background-color: #05070a; color: #00ff88; overflow-x: hidden; }
        .enterprise-box { background: rgba(10, 15, 24, 0.9); border: 1px solid rgba(0, 255, 136, 0.2); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); }
        .badge-amber { background: rgba(245, 158, 11, 0.1); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-cyan { background: rgba(6, 182, 212, 0.1); color: #06b6d4; border: 1px solid rgba(6, 182, 212, 0.3); }
        .badge-red { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-emerald-500 selection:text-black">

    <header class="border-b border-emerald-500/20 bg-black/80 backdrop-blur sticky top-0 z-50 px-6 py-3 flex justify-between items-center text-xs">
        <div class="flex items-center gap-3">
            <span class="w-2 h-2 bg-emerald-400 rounded-full animate-ping"></span>
            <span class="font-bold text-emerald-400 tracking-wider">ZDOS // SUPREME ENTERPRISE</span>
        </div>
        <div class="flex gap-4">
            <a href="enet.html" class="text-emerald-400 hover:underline">eNET</a>
            <button class="px-3 py-1 rounded bg-emerald-950/50 border border-emerald-500/30 text-emerald-300">☰ MENU</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8 flex-grow space-y-8 w-full">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-center">
            <div class="space-y-4">
                <span class="text-[10px] uppercase tracking-widest px-2.5 py-1 rounded badge-cyan font-bold">ZCLIPPER & ZDOS ORGANISM CORE</span>
                <h1 class="text-3xl md:text-5xl font-bold text-white tracking-tight">
                    Moduli web ZDOS in evoluzione.
                </h1>
                <p class="text-slate-400 text-xs md:text-sm leading-relaxed">
                    Shell eNET locale con workspace autenticati, missioni zFLOW e gateway Organism configurabile.
                </p>
                <div class="flex flex-wrap gap-3 pt-2">
                    <a href="enet.html" class="px-4 py-2 rounded bg-cyan-500 hover:bg-cyan-400 text-black font-bold text-xs transition">ENTRA NEL RESEARCH LAB →</a>
                    <button type="button" onclick="document.querySelector('.kira-launcher')?.click()" class="px-4 py-2 rounded bg-emerald-400 hover:bg-emerald-300 text-black font-bold text-xs transition">PARLA CON K.I.R.A. →</button>
                    <a href="https://high-cde.github.io/VelvetHub/" target="_blank" class="px-4 py-2 rounded bg-black border border-emerald-500/50 text-emerald-400 hover:bg-emerald-950/30 text-xs transition">VELVETHUB 18+ ↗</a>
                    <a href="enet.html" class="px-4 py-2 rounded bg-black border border-slate-700 text-slate-300 hover:bg-slate-900 text-xs transition">ESPLORA eNET →</a>
                </div>
            </div>

            <div class="enterprise-box rounded-xl p-4 flex flex-col items-center justify-center h-64 relative">
                <canvas id="netCanvas" class="absolute inset-0 w-full h-full opacity-60"></canvas>
                <div class="relative z-10 text-center pointer-events-none mt-20">
                    <p class="text-[11px] text-emerald-400">Animazione canvas decorativa · Nodo Garivalda</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('netCanvas');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = canvas.parentElement.clientWidth; canvas.height = canvas.parentElement.clientHeight; }
        window.addEventListener('resize', resize); resize();
        const nodes = Array.from({length: 15}, () => ({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, vx: (Math.random() - 0.5) * 0.8, vy: (Math.random() - 0.5) * 0.8 }));
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(0, 255, 136, 0.15)'; ctx.fillStyle = '#00ff88';
            nodes.forEach((n, i) => {
                n.x += n.vx; n.y += n.vy;
                if(n.x < 0 || n.x > canvas.width) n.vx *= -1;
                if(n.y < 0 || n.y > canvas.height) n.vy *= -1;
                ctx.beginPath(); ctx.arc(n.x, n.y, 2, 0, Math.PI * 2); ctx.fill();
                for(let j = i + 1; j < nodes.length; j++) {
                    const m = nodes[j];
                    if(Math.hypot(n.x - m.x, n.y - m.y) < 100) {
                        ctx.beginPath(); ctx.moveTo(n.x, n.y); ctx.lineTo(m.x, m.y); ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
